<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Image to URL Converter</title>
  <desc id="desc">Convert an image to a direct shareable URL with ImageURL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8fb"/>
      <stop offset="1" stop-color="#ece9ff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a5cff"/>
      <stop offset=".55" stop-color="#e35ac5"/>
      <stop offset="1" stop-color="#ff9d6a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#6659cc" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="190" fill="#6d5cf4" opacity=".12"/>
  <circle cx="120" cy="590" r="170" fill="#ff9d6a" opacity=".12"/>
  <rect x="88" y="82" width="1024" height="466" rx="38" fill="#fff" filter="url(#shadow)"/>
  <text x="140" y="155" fill="#18202d" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">imageurl</text>
  <text x="140" y="292" fill="#18202d" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">Image to</text>
  <text x="490" y="292" fill="url(#word)" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">URL Converter</text>
  <text x="142" y="354" fill="#687181" font-family="Arial, Helvetica, sans-serif" font-size="25">Get a direct image link in seconds.</text>
  <rect x="140" y="410" width="310" height="68" rx="18" fill="#6d5cf4"/>
  <text x="196" y="453" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Upload Image</text>
  <rect x="812" y="205" width="220" height="180" rx="24" fill="#18202d"/>
  <rect x="838" y="234" width="168" height="92" rx="15" fill="url(#word)" opacity=".85"/>
  <rect x="838" y="345" width="168" height="13" rx="6" fill="#53627c"/>
</svg>
